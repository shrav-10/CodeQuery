<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="100%" height="100%">
  <defs>
    <style><![CDATA[
      text {
        font-family: Arial, sans-serif;
      }
      .system-title {
        font-size: 22px;
        font-weight: bold;
        fill: #000000;
        text-anchor: middle;
      }
      .actor-label {
        font-size: 16px;
        font-weight: bold;
        fill: #000000;
        text-anchor: middle;
      }
      .usecase-text {
        font-size: 14px;
        font-weight: normal;
        fill: #000000;
        text-anchor: middle;
      }
      .stereotype {
        font-size: 11.5px;
        font-style: italic;
        fill: #000000;
        text-anchor: middle;
      }
      .solid-line {
        stroke: #000000;
        stroke-width: 1.8;
        fill: none;
      }
      .dashed-line {
        stroke: #000000;
        stroke-width: 1.5;
        stroke-dasharray: 6,4;
        fill: none;
      }
      .usecase-oval {
        fill: #FFFFFF;
        stroke: #000000;
        stroke-width: 1.6;
      }
      .boundary-rect {
        fill: #FFFFFF;
        stroke: #000000;
        stroke-width: 2;
        rx: 16;
        ry: 16;
      }
    ]]></style>

    <marker id="open-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5" fill="none" stroke="#000000" stroke-width="1.5" />
    </marker>
  </defs>

  <!-- Background (Pure White 16:9) -->
  <rect width="1600" height="900" fill="#FFFFFF" />

  <!-- ========================================================================= -->
  <!-- SYSTEM BOUNDARY: CodeQuery                                                -->
  <!-- ========================================================================= -->
  <rect x="300" y="65" width="1240" height="770" class="boundary-rect" />
  <text x="920" y="108" class="system-title">CodeQuery</text>

  <!-- ========================================================================= -->
  <!-- ACTOR: Developer                                                          -->
  <!-- ========================================================================= -->
  <g id="Actor_Developer">
    <!-- Head -->
    <circle cx="150" cy="410" r="24" stroke="#000000" stroke-width="2" fill="#FFFFFF" />
    <!-- Body -->
    <line x1="150" y1="434" x2="150" y2="515" stroke="#000000" stroke-width="2" />
    <!-- Arms -->
    <line x1="105" y1="460" x2="195" y2="460" stroke="#000000" stroke-width="2" />
    <!-- Legs -->
    <line x1="150" y1="515" x2="115" y2="595" stroke="#000000" stroke-width="2" />
    <line x1="150" y1="515" x2="185" y2="595" stroke="#000000" stroke-width="2" />
    <!-- Label -->
    <text x="150" y="628" class="actor-label">Developer</text>
  </g>

  <!-- ========================================================================= -->
  <!-- COLUMN 1 (LEFT COLUMN - USER-FACING / INITIATING USE CASES)               -->
  <!-- ========================================================================= -->

  <!-- 1. Submit Repository URL -->
  <g id="UC_SubmitRepo">
    <ellipse cx="550" cy="190" rx="120" ry="40" class="usecase-oval" />
    <text x="550" y="185" class="usecase-text">Submit</text>
    <text x="550" y="205" class="usecase-text">Repository URL</text>
  </g>

  <!-- 2. Analyze Repository -->
  <g id="UC_AnalyzeRepo">
    <ellipse cx="550" cy="350" rx="115" ry="40" class="usecase-oval" />
    <text x="550" y="345" class="usecase-text">Analyze</text>
    <text x="550" y="365" class="usecase-text">Repository</text>
  </g>

  <!-- 6. Ask Code Question -->
  <g id="UC_AskQuestion">
    <ellipse cx="550" cy="540" rx="115" ry="40" class="usecase-oval" />
    <text x="550" y="535" class="usecase-text">Ask Code</text>
    <text x="550" y="555" class="usecase-text">Question</text>
  </g>

  <!-- 9. View Answer -->
  <g id="UC_ViewAnswer">
    <ellipse cx="550" cy="730" rx="110" ry="40" class="usecase-oval" />
    <text x="550" y="735" class="usecase-text">View Answer</text>
  </g>


  <!-- ========================================================================= -->
  <!-- COLUMN 2 (RIGHT COLUMN - SYSTEM PROCESSING & INCLUDED USE CASES)          -->
  <!-- ========================================================================= -->

  <!-- 3. Parse and Chunk Code -->
  <g id="UC_ParseChunk">
    <ellipse cx="1170" cy="200" rx="125" ry="40" class="usecase-oval" />
    <text x="1170" y="195" class="usecase-text">Parse and</text>
    <text x="1170" y="215" class="usecase-text">Chunk Code</text>
  </g>

  <!-- 4. Generate Embeddings -->
  <g id="UC_GenerateEmbeddings">
    <ellipse cx="1170" cy="340" rx="120" ry="40" class="usecase-oval" />
    <text x="1170" y="335" class="usecase-text">Generate</text>
    <text x="1170" y="355" class="usecase-text">Embeddings</text>
  </g>

  <!-- 5. Store Code Vectors -->
  <g id="UC_StoreVectors">
    <ellipse cx="1170" cy="480" rx="120" ry="40" class="usecase-oval" />
    <text x="1170" y="475" class="usecase-text">Store Code</text>
    <text x="1170" y="495" class="usecase-text">Vectors</text>
  </g>

  <!-- 7. Retrieve Relevant Code -->
  <g id="UC_RetrieveCode">
    <ellipse cx="1170" cy="620" rx="125" ry="40" class="usecase-oval" />
    <text x="1170" y="615" class="usecase-text">Retrieve</text>
    <text x="1170" y="635" class="usecase-text">Relevant Code</text>
  </g>

  <!-- 8. Generate AI Answer -->
  <g id="UC_GenerateAnswer">
    <ellipse cx="1170" cy="760" rx="120" ry="40" class="usecase-oval" />
    <text x="1170" y="755" class="usecase-text">Generate AI</text>
    <text x="1170" y="775" class="usecase-text">Answer</text>
  </g>


  <!-- ========================================================================= -->
  <!-- ACTOR ASSOCIATIONS (SOLID LINES)                                          -->
  <!-- ========================================================================= -->
  <!-- Developer -> Submit Repository URL -->
  <line x1="195" y1="450" x2="432" y2="198" class="solid-line" />

  <!-- Developer -> Ask Code Question -->
  <line x1="195" y1="470" x2="437" y2="535" class="solid-line" />

  <!-- Developer -> View Answer -->
  <line x1="195" y1="490" x2="442" y2="722" class="solid-line" />


  <!-- ========================================================================= -->
  <!-- USE CASE RELATIONSHIPS (DASHED LINES WITH «include»)                       -->
  <!-- ========================================================================= -->

  <!-- 1. Submit Repository URL -> Analyze Repository -->
  <line x1="550" y1="230" x2="550" y2="302" class="dashed-line" marker-end="url(#open-arrow)" />
  <polyline points="545,302 550,310 555,302" fill="none" stroke="#000000" stroke-width="1.5" />
  <text x="590" y="275" class="stereotype">&#171;include&#187;</text>

  <!-- 2. Analyze Repository -> Parse and Chunk Code -->
  <line x1="660" y1="335" x2="1038" y2="210" class="dashed-line" marker-end="url(#open-arrow)" />
  <polyline points="1030,207 1046,207 1035,218" fill="none" stroke="#000000" stroke-width="1.5" />
  <text x="850" y="260" class="stereotype">&#171;include&#187;</text>

  <!-- 3. Parse and Chunk Code -> Generate Embeddings -->
  <line x1="1170" y1="240" x2="1170" y2="292" class="dashed-line" marker-end="url(#open-arrow)" />
  <polyline points="1165,292 1170,300 1175,292" fill="none" stroke="#000000" stroke-width="1.5" />
  <text x="1212" y="275" class="stereotype">&#171;include&#187;</text>

  <!-- 4. Generate Embeddings -> Store Code Vectors -->
  <line x1="1170" y1="380" x2="1170" y2="432" class="dashed-line" marker-end="url(#open-arrow)" />
  <polyline points="1165,432 1170,440 1175,432" fill="none" stroke="#000000" stroke-width="1.5" />
  <text x="1212" y="415" class="stereotype">&#171;include&#187;</text>

  <!-- 5. Ask Code Question -> Retrieve Relevant Code -->
  <line x1="662" y1="548" x2="1038" y2="608" class="dashed-line" marker-end="url(#open-arrow)" />
  <polyline points="1032,600 1046,609 1030,612" fill="none" stroke="#000000" stroke-width="1.5" />
  <text x="850" y="570" class="stereotype">&#171;include&#187;</text>

  <!-- 6. Retrieve Relevant Code -> Generate AI Answer -->
  <line x1="1170" y1="660" x2="1170" y2="712" class="dashed-line" marker-end="url(#open-arrow)" />
  <polyline points="1165,712 1170,720 1175,712" fill="none" stroke="#000000" stroke-width="1.5" />
  <text x="1212" y="695" class="stereotype">&#171;include&#187;</text>

  <!-- 7. Generate AI Answer -> View Answer -->
  <line x1="1050" y1="755" x2="668" y2="732" class="dashed-line" marker-end="url(#open-arrow)" />
  <polyline points="676,727 660,732 675,739" fill="none" stroke="#000000" stroke-width="1.5" />
  <text x="850" y="735" class="stereotype">&#171;include&#187;</text>

</svg>
